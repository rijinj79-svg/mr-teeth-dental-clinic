{% extends 'base.html' %}{% block title %}Login | Mr.Teeth{% endblock %}
{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="eyebrow">Patient Portal</div>
            <h1 class="h2 fw-bold mt-2">Welcome back</h1>
            <p class="small-muted">Sign in to continue to Mr.Teeth.</p>
        </div>
        <form method="post">{% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input class="form-control" name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <input id="login-password" class="form-control" type="password" name="password" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" data-password-toggle="login-password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button class="btn btn-gold w-100 mt-2" type="submit">Login</button>
            <div class="text-center mt-4 pt-3 border-top">
                <p class="small-muted mb-2" style="font-size: 13px;">
                    Clinic Staff Access
                </p>

                <a href="{% url 'staff_login' %}"
                    class="btn btn-outline-dark px-4 py-2"
                    style="
                    border-radius: 8px;
                    font-weight: 600;
                    font-size: 14px;
                    ">
                    <i class="bi bi-person-badge me-2"></i>
                        Staff Portal
                </a>
                <div class="text-center mt-3">
                <a href="{% url 'admin_login' %}"
                    class="btn btn-dark w-100">
                    <i class="bi bi-shield-lock-fill me-2"></i>
                        Admin Login
                </a>
</div>

</div>
        </form>
        <p class="text-center small-muted mt-4 mb-0">Don't have an account?
            <a href="{% url 'register' %}" class="fw-semibold">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
